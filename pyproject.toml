[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "repowise"
version = "1.0.0"
description = "AI-powered GitHub repository summarizer — understand any repo in seconds"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["github", "ai", "cli", "developer-tools", "code-analysis", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.25.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
repowise = "src.main:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/repowise"
Issues = "https://github.com/YOUR_USERNAME/repowise/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
